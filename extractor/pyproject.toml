[project]
name = "pmt-extractor"
version = "0.1.0"
description = "Labracadabra: extract, standardise and merge medical report values"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pypdf>=5.0",
  "cryptography>=42",  # AES-encrypted (empty-password) PDFs
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pmt = "pmt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
