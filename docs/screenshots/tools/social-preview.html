<!doctype html>
<!-- GitHub social preview (1280x640). Render with: node docs/screenshots/tools/social-preview.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(900px 600px at 85% 20%, #2a2f7a 0%, transparent 60%),
                radial-gradient(700px 500px at 10% 110%, #3a1f6e 0%, transparent 60%),
                #0d1024;
    color: #eef1ff; position: relative;
  }
  .grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 32px 32px; }
  .text { position: absolute; left: 72px; top: 92px; width: 500px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
  .brand img { width: 72px; height: 72px; filter: drop-shadow(0 8px 24px rgba(92, 110, 255, .45)); }
  .brand h1 { font-size: 50px; font-weight: 750; letter-spacing: -1px; }
  .lead { font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -.5px; margin-bottom: 18px; }
  .lead em { font-style: normal; background: linear-gradient(90deg, #7ea0ff, #b18cff); -webkit-background-clip: text; color: transparent; }
  .sub { font-size: 20px; line-height: 1.45; color: #b8bfe6; margin-bottom: 34px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-size: 15px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #dfe3ff; }
  .shot { position: absolute; left: 610px; top: 78px; width: 760px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12);
    transform: perspective(1800px) rotateY(-11deg) rotateX(3deg); transform-origin: left center; }
  .shot .bar { height: 26px; background: #1b1f3d; display: flex; align-items: center; gap: 7px; padding-left: 12px; }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3f6b; }
  .shot .crop { height: 540px; overflow: hidden; }
  .shot img { display: block; width: 100%; }
  .phone { position: absolute; left: 1020px; top: 250px; width: 200px; border-radius: 28px; overflow: hidden;
    border: 6px solid #15182f; box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.15); }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="text">
    <div class="brand"><img src="../../../web/public/logo.svg" alt=""><h1>Labracadabra</h1></div>
    <div class="lead">All your lab results.<br><em>One clean health history.</em></div>
    <div class="sub">Messy PDFs and phone photos in; trends, comparisons and every blood panel at a glance out.</div>
    <div class="chips">
      <span class="chip">Self-hosted on AWS</span>
      <span class="chip">Your own Claude API key</span>
      <span class="chip">Costs cents</span>
      <span class="chip">MIT</span>
    </div>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><div class="crop"><img src="../blood-panels-dark.webp" alt=""></div></div>
  <div class="phone"><img src="../phone-test.webp" alt=""></div>
</body>
</html>
