# Canonical test catalog: the single source of truth for standardisation.
#
# Fields
#   id        stable snake_case key (never rename; results.json references it)
#   name      display name (English)
#   panel     panel id from panels.yaml
#   unit      canonical unit (SI by default) — all values are stored in this unit
#   mw        molar mass g/mol → enables automatic mass⇄molar conversion (mg/dL ⇄ mmol/L …)
#   factors   extra explicit conversions: {unit: k} meaning canonical = value × k
#   affine    non-proportional conversions: {unit: [a, b]} meaning canonical = a × value + b
#   alt_units units offered in the UI unit switcher (must be convertible)
#   kind      numeric (default) | qualitative (ordinal/positive-negative) | text
#   ref       default adult reference range in canonical unit (used only if the lab gives none)
#   ref_m / ref_f   sex-specific default ranges
#   ref_policy  catalog ⇒ always flag against `ref`, ignore the lab's printed range (kept as text only);
#             for tests where labs print guideline/risk tiers instead of reference intervals (lipids)
#   limits    physiological plausibility bounds in canonical unit; outside ⇒ flagged for review
#   decimals  display precision in canonical unit
#   log       true ⇒ growth is multiplicative (show doubling time), e.g. PSA
#   on_page   {page_type: other_id}: store under other_id when printed on that page type (stress-test BP ≠ clinic BP)
#   merge_into  after conversion, store results under this id instead (same quantity, different name)
#   aliases   names seen on reports (any language); matching is case/space/punctuation-insensitive
#
# Conversion factors here are standard clinical-chemistry values; contributors please cite a source
# in the PR when adding new ones (see docs/catalog-contributing.md).

