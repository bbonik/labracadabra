# Unit spelling normalisation. Keys are matched case-insensitively after stripping spaces.
# Values are the canonical spelling understood by the unit algebra in normalize.py / units.ts:
#   amount: g mg ug ng pg | mol mmol umol nmol pmol | IU mIU uIU | U mU kU   per volume: L dL mL uL
# Anything else (%, fL, pg (cell), ms, mmHg, ...) only converts via explicit per-test factors.
synonyms:
  # micro sign variants
  "µg/l": ug/L
  "μg/l": ug/L
  "mcg/l": ug/L
  "µg/dl": ug/dL
  "μg/dl": ug/dL
  "mcg/dl": ug/dL
  "µmol/l": umol/L
  "μmol/l": umol/L
  "micromol/l": umol/L
  "µiu/ml": uIU/mL
  "μiu/ml": uIU/mL
  "µu/ml": uIU/mL
  "uu/ml": uIU/mL
  "µkat/l": ukat/L
  "μkat/l": ukat/L
  # common spellings
  "mg/dl": mg/dL
  "g/dl": g/dL
  "g/l": g/L
  "mg/l": mg/L
  "ng/ml": ng/mL
  "pg/ml": pg/mL
  "ng/dl": ng/dL
  "ng/l": ng/L
  "mmol/l": mmol/L
  "nmol/l": nmol/L
  "pmol/l": pmol/L
  "mmol/mol": mmol/mol
  "iu/l": IU/L
  "iu/ml": IU/mL
  "miu/l": mIU/L
  "miu/ml": mIU/mL
  "u/l": U/L
  "u/ml": U/mL
  "ku/l": kU/L
  "meq/l": mEq/L
  "mg/g": mg/g
  "mg/mmol": mg/mmol
  # counts
  "x10^9/l": 10^9/L
  "x10e9/l": 10^9/L
  "10^9/l": 10^9/L
  "10*9/l": 10^9/L
  "×10⁹/l": 10^9/L
  "x10⁹/l": 10^9/L
  "10^3/ul": 10^9/L
  "10^3/µl": 10^9/L
  "x10^3/ul": 10^9/L
  "x10^3/µl": 10^9/L
  "k/ul": 10^9/L
  "k/µl": 10^9/L
  "/nl": 10^9/L
  "x10^12/l": 10^12/L
  "10^12/l": 10^12/L
  "×10¹²/l": 10^12/L
  "x10¹²/l": 10^12/L
  "10^6/ul": 10^12/L
  "10^6/µl": 10^12/L
  "x10^6/ul": 10^12/L
  "x10^6/µl": 10^12/L
  "m/ul": 10^12/L
  "m/µl": 10^12/L
  "/pl": 10^12/L
  "cells/µl": cells/uL
  "cells/ul": cells/uL
  "/µl": cells/uL
  "/ul": cells/uL
  "/hpf": /HPF
  # misc
  "fl": fL
  "pg": pg
  "%": "%"
  "l/l": L/L
  "mm/hr": mm/h
  "mm/h": mm/h
  "mm/1sthr": mm/h
  "ml/min/1.73m2": mL/min/1.73m2
  "ml/min/1.73m²": mL/min/1.73m2
  "ml/min/1.73 m2": mL/min/1.73m2
  "kg/m2": kg/m2
  "kg/m²": kg/m2
  "kg": kg
  "lb": lb
  "lbs": lb
  "cm": cm
  "in": in
  "mmhg": mmHg
  "bpm": bpm
  "/min": bpm
  "ms": ms
  "msec": ms
  "s": s
  "sec": s
  "mets": METs
  "min": min
  "l": L
  "ml": mL
  "l/s": L/s
