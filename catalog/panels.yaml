    - { id: cardio.ct,        name: Coronary CT / calcium score, icon: "🩻" }
- id: imaging
  name: Imaging & radiology
  icon: "🩻"
  children:
    - { id: imaging.findings, name: Radiology findings, icon: "🩻" }
