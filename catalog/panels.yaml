- id: screening
  name: Other screening
  icon: "👁"
  children:
    - { id: screening.vision,  name: Vision,  icon: "👁" }
    - { id: screening.hearing, name: Hearing, icon: "👂" }
    - { id: screening.lung,    name: Lung function, icon: "🫁" }
